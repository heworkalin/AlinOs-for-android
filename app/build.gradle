plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'alin.android.alinos'
    compileSdk 36

    // ========== 签名配置 ==========
    Properties signProp = new Properties()
    File propFile = rootProject.file("signing.properties")
    println("====签名调试=== 配置文件存在：" + propFile.exists())
    if (propFile.exists()) {
        signProp.load(new FileInputStream(propFile))
        println("====签名调试=== jks路径：" + signProp.getProperty("storeFile"))
        println("====签名调试=== 密钥别名：" + signProp.getProperty("keyAlias"))
    }

    signingConfigs {
        release {
            if (propFile.exists()) {
                storeFile file(signProp.getProperty("storeFile"))
                storePassword signProp.getProperty("storePassword")
                keyAlias signProp.getProperty("keyAlias")
                keyPassword signProp.getProperty("keyPassword")
            }
        }
        debug {
            if (propFile.exists()) {
                storeFile file(signProp.getProperty("storeFile"))
                storePassword signProp.getProperty("storePassword")
                keyAlias signProp.getProperty("keyAlias")
                keyPassword signProp.getProperty("keyPassword")
            }
        }
    }

    defaultConfig {
        applicationId "alin.android.alinos"
        minSdk 24
        targetSdk 36
        versionCode 10
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    flavorDimensions "abi"
    productFlavors {
        arm64 {
            dimension "abi"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
        x86_64 {
            dimension "abi"
            ndk {
                abiFilters "x86_64"
            }
        }
        arm {
            dimension "abi"
            ndk {
                abiFilters "armeabi-v7a"
            }
        }
        i686 {
            dimension "abi"
            ndk {
                abiFilters "x86"
            }
        }
    }

    sourceSets {
        arm64 {
            assets.srcDirs += "src/arm64/assets"
        }
        x86_64 {
            assets.srcDirs += "src/x86_64/assets"
        }
        arm {
            assets.srcDirs += "src/arm/assets"
        }
        i686 {
            assets.srcDirs += "src/i686/assets"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    aaptOptions {
        noCompress 'tar.gz.so'
    }
}



configurations {
    all {
        exclude group: 'org.jetbrains', module: 'annotations-java5'
    }
}
dependencies {
    // 基础依赖
    implementation libs.appcompat
    implementation libs.material
    implementation libs.firebase.crashlytics.buildtools
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // 项目原有依赖
    implementation 'com.jcraft:jsch:0.1.55'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.airbnb.android:lottie:6.1.0'

    // sherpa-onnx 语音引擎 (1.13.5: 修复 OnlineTransducerModelConfig.qnnConfig 与 JNI 原生库不匹配的崩溃)
    implementation files('libs/sherpa-onnx-1.13.5.aar')
    // Vosk 语音识别
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.media3:media3-exoplayer:1.2.0'
    implementation 'androidx.media3:media3-extractor:1.2.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.2.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'commons-io:commons-io:2.15.1'

    // Shizuku 依赖
    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    //herpa-onnx

    // Markwon 核心库，处理基础的 Markdown 解析与渲染
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'
    implementation 'io.noties.markwon:recycler:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:syntax-highlight:4.6.2'
    //mt管理器的文件注入,被用于便捷查看该应用的私有目录
    implementation 'com.github.L-JINBIN:MTDataFilesProvider:v1.0.0'
//    implementation 'io.noties:prism4j:2.0.0'
//    // 注解处理器，用于生成 GrammarLocator
//    annotationProcessor('io.noties:prism4j-bundler:2.0.0') {
//        exclude group: 'org.jetbrains', module: 'annotations-java5'
//    }
    // Prism4j 注解处理器，用于在编译时生成 GrammarLocator
    //annotationProcessor 'io.noties:prism4j-bundler:2.0.0'
    // ✅ 移除单独的 JNA 依赖，Vosk AAR 已经包含了正确的 JNA
    // implementation 'net.java.dev.jna:jna:jna:5.14.0@aar'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.window:window:1.2.0'
